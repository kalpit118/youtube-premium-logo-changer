<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>YouTube Premium Logo Changer</title>
  <link rel="stylesheet" href="popup.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="popup-container">
    <!-- Header -->
    <header class="header">
      <div class="brand">
        <div class="logo-icon-wrap">
          <svg viewBox="0 0 28 20" width="22" height="16">
            <path fill="#FF0000" d="M27.97 3.12C27.64 1.89 26.68 0.93 25.45 0.60C23.22 0 14.3 0 14.3 0C14.3 0 5.39 0 3.16 0.60C1.93 0.93 0.97 1.89 0.64 3.12C0 5.35 0 10 0 10C0 10 0 14.65 0.64 16.88C0.97 18.11 1.93 19.07 3.16 19.40C5.39 20 14.3 20 14.3 20C14.3 20 23.22 20 25.45 19.40C26.68 19.07 27.64 18.11 27.97 16.88C28.61 14.65 28.61 10 28.61 10C28.61 10 28.61 5.35 27.97 3.12Z"/>
            <polygon fill="#FFFFFF" points="11.42,14.28 18.63,10 11.42,5.71"/>
          </svg>
        </div>
        <span class="brand-name">YT <span class="accent">Premium</span></span>
      </div>
      <div class="status-badge" id="statusBadge">Active</div>
    </header>

    <!-- Main Content -->
    <main class="content">
      <!-- Live Preview Box -->
      <div class="card preview-card">
        <div class="card-label">Live Preview</div>
        <div class="logo-preview-box">
          <svg viewBox="0 0 115 24" width="130" height="28" class="preview-svg">
            <!-- Play Icon -->
            <g>
              <path fill="#FF0000" d="M27.97 3.12C27.64 1.89 26.68 0.93 25.45 0.60C23.22 0 14.3 0 14.3 0C14.3 0 5.39 0 3.16 0.60C1.93 0.93 0.97 1.89 0.64 3.12C0 5.35 0 10 0 10C0 10 0 14.65 0.64 16.88C0.97 18.11 1.93 19.07 3.16 19.40C5.39 20 14.3 20 14.3 20C14.3 20 23.22 20 25.45 19.40C26.68 19.07 27.64 18.11 27.97 16.88C28.61 14.65 28.61 10 28.61 10C28.61 10 28.61 5.35 27.97 3.12Z"/>
              <polygon fill="#FFFFFF" points="11.42,14.28 18.63,10 11.42,5.71"/>
            </g>
            <!-- Preview Text Group -->
            <g id="previewTextGroup" fill="#FFFFFF"></g>
          </svg>
          <span class="country-preview">IN</span>
        </div>
      </div>

      <!-- Controls -->
      <div class="card">
        <!-- Toggle Switch -->
        <div class="control-row">
          <div class="control-info">
            <span class="control-title">Enable Replacement</span>
            <span class="control-desc">Change YouTube logo text on youtube.com</span>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="toggleEnabled" checked>
            <span class="slider"></span>
          </label>
        </div>

        <hr class="divider">

        <!-- Custom Text Input -->
        <div class="control-group">
          <label for="customTextInput" class="control-title">Logo Name Text</label>
          <div class="input-wrapper">
            <input type="text" id="customTextInput" value="Premium" placeholder="Enter custom text...">
            <button id="btnSave" class="btn-primary">Apply</button>
          </div>
        </div>

        <!-- Quick Presets -->
        <div class="presets-group">
          <span class="presets-label">Quick Presets:</span>
          <div class="presets-buttons">
            <button class="preset-btn active" data-preset="Premium">Premium</button>
            <button class="preset-btn" data-preset="YouTube Premium">YT Premium</button>
            <button class="preset-btn" data-preset="PRO">PRO</button>
            <button class="preset-btn" data-preset="PLUS">PLUS</button>
          </div>
        </div>
      </div>

      <!-- Rainbow Star on GitHub Button -->
      <a
        href="https://github.com/kalpit118/youtube-premium-logo-changer"
        target="_blank"
        rel="noopener noreferrer"
        class="rainbow-star-btn"
        id="starGithubBtn"
        title="Star on GitHub"
      >
        <div class="star-btn-inner">
          <div class="star-btn-left">
            <svg class="github-icon" viewBox="0 0 438.549 438.549">
              <path
                d="M409.132 114.573c-19.608-33.596-46.205-60.194-79.798-79.8-33.598-19.607-70.277-29.408-110.063-29.408-39.781 0-76.472 9.804-110.063 29.408-33.596 19.605-60.192 46.204-79.8 79.8C9.803 148.168 0 184.854 0 224.63c0 47.78 13.94 90.745 41.827 128.906 27.884 38.164 63.906 64.572 108.063 79.227 5.14.954 8.945.283 11.419-1.996 2.475-2.282 3.711-5.14 3.711-8.562 0-.571-.049-5.708-.144-15.417a2549.81 2549.81 0 01-.144-25.406l-6.567 1.136c-4.187.767-9.469 1.092-15.846 1-6.374-.089-12.991-.757-19.842-1.999-6.854-1.231-13.229-4.086-19.13-8.559-5.898-4.473-10.085-10.328-12.56-17.556l-2.855-6.57c-1.903-4.374-4.899-9.233-8.992-14.559-4.093-5.331-8.232-8.945-12.419-10.848l-1.999-1.431c-1.332-.951-2.568-2.098-3.711-3.429-1.142-1.331-1.997-2.663-2.568-3.997-.572-1.335-.098-2.43 1.427-3.289 1.525-.859 4.281-1.276 8.28-1.276l5.708.853c3.807.763 8.516 3.042 14.133 6.851 5.614 3.806 10.229 8.754 13.846 14.842 4.38 7.806 9.657 13.754 15.846 17.847 6.184 4.093 12.419 6.136 18.699 6.136 6.28 0 11.704-.476 16.274-1.423 4.565-.952 8.848-2.383 12.847-4.285 1.713-12.758 6.377-22.559 13.988-29.41-10.848-1.14-20.601-2.857-29.264-5.14-8.658-2.286-17.605-5.996-26.835-11.14-9.235-5.137-16.896-11.516-22.985-19.126-6.09-7.614-11.088-17.61-14.987-29.979-3.901-12.374-5.852-26.648-5.852-42.826 0-23.035 7.52-42.637 22.557-58.817-7.044-17.318-6.379-36.732 1.997-58.24 5.52-1.715 13.706-.428 24.554 3.853 10.85 4.283 18.794 7.952 23.84 10.994 5.046 3.041 9.089 5.618 12.135 7.708 17.705-4.947 35.976-7.421 54.818-7.421s37.117 2.474 54.823 7.421l10.849-6.849c7.419-4.57 16.18-8.758 26.262-12.565 10.088-3.805 17.802-4.853 23.134-3.138 8.562 21.509 9.325 40.922 2.279 58.24 15.036 16.18 22.559 35.787 22.559 58.817 0 16.178-1.958 30.497-5.853 42.966-3.9 12.471-8.941 22.457-15.125 29.979-6.191 7.521-13.901 13.85-23.131 18.986-9.232 5.14-18.182 8.85-26.84 11.136-8.662 2.286-18.415 4.004-29.263 5.146 9.894 8.562 14.842 22.077 14.842 40.539v60.237c0 3.422 1.19 6.279 3.572 8.562 2.379 2.279 6.136 2.95 11.276 1.995 44.163-14.653 80.185-41.062 108.068-79.226 27.88-38.161 41.825-81.126 41.825-128.906-.01-39.771-9.818-76.454-29.414-110.049z"
                fill="#FFFFFF"
              ></path>
            </svg>
            <span class="star-btn-title">Star on GitHub</span>
          </div>
          <div class="star-btn-right">
            <svg
              class="star-icon"
              viewBox="0 0 24 24"
              xmlns="http://www.w3.org/2000/svg"
            >
              <path
                clip-rule="evenodd"
                d="M10.788 3.21c.448-1.077 1.976-1.077 2.424 0l2.082 5.006 5.404.434c1.164.093 1.636 1.545.749 2.305l-4.117 3.527 1.257 5.273c.271 1.136-.964 2.033-1.96 1.425L12 18.354 7.373 21.18c-.996.608-2.231-.29-1.96-1.425l1.257-5.273-4.117-3.527c-.887-.76-.415-2.212.749-2.305l5.404-.434 2.082-5.005Z"
                fill-rule="evenodd"
              ></path>
            </svg>
            <span class="star-count-num" id="starCountNum">Star</span>
          </div>
        </div>
      </a>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <span>Target site: <strong>youtube.com</strong></span>
      <span class="version">v1.0.0</span>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
